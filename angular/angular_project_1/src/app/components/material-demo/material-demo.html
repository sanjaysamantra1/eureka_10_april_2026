<h3 class="text-center">Let's learn Angular Material</h3>

<div class="border border-3 rounded-3 p-3 m-2">
  <h4>Buttons::</h4>
  <button matButton>Basic Button</button>
  <button matButton="elevated">elevated button</button>
  <button matButton="outlined">outlined button</button>
  <button matButton="filled">filled button</button>
  <button matButton="tonal">tonal button</button>
</div>

<div class="border border-3 rounded-3 p-3 m-2">
  <h4>card::</h4>
  <mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>Shiba Inu</mat-card-title>
    <mat-card-subtitle>Dog Breed</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image src="https://material.angular.dev/assets/img/examples/shiba2.jpg" alt="Photo of a Shiba Inu">
  <mat-card-content>
    <p>
      The Shiba Inu is the smallest of the six original and distinct spitz breeds of dog from Japan.
      A small, agile dog that copes very well with mountainous terrain, the Shiba Inu was originally
      bred for hunting.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
  </mat-card-actions>
</mat-card>
</div>

<div class="border border-3 rounded-3 p-3 m-2">
  <h4>Dialog::</h4>
  <button matButton="elevated" (click)="openDialog()">Open dialog without animation</button>
</div>
